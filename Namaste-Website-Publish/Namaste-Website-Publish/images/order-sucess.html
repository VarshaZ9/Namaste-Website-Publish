<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - Namaste Nutritive</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Header -->

    <header class="top-header">

        <div class="logo">

            <h1>Welcome To Namaste Nutritive 🙏</h1>

        </div>


        <div class="header-actions">

            <button onclick="window.location.href='index.html'">
                Home
            </button>

            <button onclick="window.location.href='cart.html'">
                🛒 Cart
                <span id="cartCount">0</span>
            </button>

        </div>

    </header>



    <!-- Success Section -->

    <section class="order-success">

        <div class="success-box">

            <div class="success-icon">
                ✓
            </div>


            <h2>Order Placed Successfully! 🎉</h2>

            <p>
                Thank you for shopping with
                <strong>Namaste Nutritive</strong>.
            </p>


            <!-- Order Details -->

            <div class="success-details">

                <p>
                    <strong>Order ID:</strong>
                    <span id="successOrderId"></span>
                </p>

                <p>
                    <strong>Customer Name:</strong>
                    <span id="successCustomerName"></span>
                </p>

                <p>
                    <strong>Total Amount:</strong>
                    ₹<span id="successTotal"></span>
                </p>

                <p>
                    <strong>Payment Method:</strong>
                    <span id="successPayment"></span>
                </p>

            </div>


            <!-- Address -->

            <div class="success-address">

                <h3>Delivery Address</h3>

                <p id="successAddress"></p>

            </div>


            <!-- Buttons -->

            <div class="success-buttons">

                <button
                    class="primary-btn"
                    onclick="window.location.href='index.html#products'">

                    Continue Shopping

                </button>


                <button
                    class="secondary-btn"
                    onclick="window.location.href='index.html'">

                    Go To Home

                </button>

            </div>

        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 Namaste Nutritive. All Rights Reserved.
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
</head>
